name: Release

# Builds the desktop app for macOS and Windows.
# Runs when a version tag is pushed (git tag v1.0 && git push origin v1.0),
# or by hand from the Actions tab ("Run workflow").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the files to the GitHub release

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build --config Release --target HouseholdFinance

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/HouseholdFinance.app -dmg
          mv build/HouseholdFinance.dmg HouseholdFinance-macOS.dmg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path HouseholdFinance | Out-Null
          Copy-Item build/Release/HouseholdFinance.exe HouseholdFinance/
          windeployqt --release HouseholdFinance/HouseholdFinance.exe
          Compress-Archive -Path HouseholdFinance -DestinationPath HouseholdFinance-Windows.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HouseholdFinance-${{ matrix.name }}
          path: HouseholdFinance-${{ matrix.name }}.*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HouseholdFinance-${{ matrix.name }}.*
